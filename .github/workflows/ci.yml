name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, staging, production]
  workflow_call:
    inputs:
      run-integration:
        description: Run the full real Kafka/Connect suite for a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-promotion.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted_files=$(gofmt -l .)
          if [ -n "$unformatted_files" ]; then
            echo "$unformatted_files"
            exit 1
          fi
      - name: Verify dependencies
        run: go mod verify
      - name: Test repository policies
        run: bash scripts/test-repository-policy.sh
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -shuffle=on -count=3 -timeout=5m ./...
      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t kafka-connect-healer:ci .
      - name: Smoke test container
        run: bash scripts/docker-smoke-test.sh kafka-connect-healer:ci
      - name: Render Kubernetes example
        run: kubectl kustomize examples/kubernetes

  integration:
    # Every proposed merge into dev, staging, or production runs the full suite.
    # Releases also test the tagged commit through workflow_call.
    if: >-
      github.event_name == 'pull_request' ||
      inputs.run-integration == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEALER_TEST_IMAGE: kafka-connect-healer:integration
      CONNECT_TEST_IMAGE: kafka-connect-healer-connect:integration
      INTEGRATION_ARTIFACTS: ${{ github.workspace }}/tests/integration/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/integration/go.sum
      - name: Verify integration dependencies
        working-directory: tests/integration
        run: go mod verify
      - name: Vet integration tests
        working-directory: tests/integration
        run: go vet ./...
      - name: Test real Kafka and Connect with Testcontainers
        shell: bash
        run: |
          mkdir -p "$INTEGRATION_ARTIFACTS"
          set -o pipefail
          go -C tests/integration test -race -count=1 -timeout=20m -json ./... \
            | tee "$INTEGRATION_ARTIFACTS/test-results.jsonl"
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-diagnostics
          path: tests/integration/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  required:
    # Only PR validation can satisfy the merge rule. A faster branch-push run
    # must not publish the same required check name against the PR's head SHA.
    name: ${{ github.event_name == 'pull_request' && 'CI required' || 'CI branch or release' }}
    if: always()
    needs: [branch-policy, verify, container, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REQUIRED: ${{ github.event_name == 'pull_request' || inputs.run-integration == true }}
        run: |
          [[ "$BRANCH_POLICY_RESULT" == success ]]
          [[ "$VERIFY_RESULT" == success ]]
          [[ "$CONTAINER_RESULT" == success ]]
          if [[ "$INTEGRATION_REQUIRED" == true ]]; then
            [[ "$INTEGRATION_RESULT" == success ]]
          else
            [[ "$INTEGRATION_RESULT" == skipped || "$INTEGRATION_RESULT" == success ]]
          fi
