name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      run-integration:
        description: Run the full real Kafka/Connect suite for a release
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  # Body/title edits cannot cancel an in-flight validation of the code.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'validation' }}
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  plan:
    name: Plan and promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select validation mode
        id: mode
        run: |
          mode=$(bash scripts/ci-mode.sh)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          printf '## Validation plan\n\nMode: **%s**\n' "$mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-promotion.sh
      - name: Validate candidate snapshot and staging freeze
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-promotion-state.sh

  metadata:
    name: Reuse previous CI
    needs: plan
    if: needs.plan.outputs.mode == 'metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify prior full validation for these exact commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-previous-ci.sh

  verify:
    name: Go checks
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'feature'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted_files=$(gofmt -l .)
          if [ -n "$unformatted_files" ]; then
            echo '::error title=CI_FORMATTING::Go source is not formatted. Run gofmt on the listed files and commit the changes.'
            echo "$unformatted_files"
            exit 1
          fi
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Test repository policies
        run: bash scripts/test-repository-policy.sh
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        if: needs.plan.outputs.mode == 'full'
        run: go test -race -shuffle=on -count=1 -timeout=5m ./...
      - name: Unit tests
        if: needs.plan.outputs.mode == 'feature'
        run: go test -count=1 -timeout=5m ./...
      - name: Check vulnerabilities
        if: needs.plan.outputs.mode == 'full'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  container:
    name: Container and Kubernetes
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t kafka-connect-healer:ci .
      - name: Smoke test container
        run: bash scripts/docker-smoke-test.sh kafka-connect-healer:ci
      - name: Render Kubernetes example
        run: kubectl kustomize examples/kubernetes

  integration:
    name: Kafka Connect integration
    needs: plan
    # Every proposed merge into dev, staging, or main runs the full suite.
    # Releases also test the tagged commit through workflow_call.
    if: >-
      needs.plan.outputs.mode == 'full' &&
      (github.event_name == 'pull_request' || inputs.run-integration == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEALER_TEST_IMAGE: kafka-connect-healer:integration
      CONNECT_TEST_IMAGE: kafka-connect-healer-connect:integration
      INTEGRATION_ARTIFACTS: ${{ github.workspace }}/tests/integration/artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tests/integration/go.sum
      - name: Verify integration dependencies
        working-directory: tests/integration
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Vet integration tests
        working-directory: tests/integration
        run: go vet ./...
      - name: Test real Kafka and Connect with Testcontainers
        shell: bash
        run: |
          mkdir -p "$INTEGRATION_ARTIFACTS"
          set -o pipefail
          go -C tests/integration test -race -count=1 -timeout=20m -json ./... \
            | tee "$INTEGRATION_ARTIFACTS/test-results.jsonl"
      - name: Report integration failures and timings
        if: always()
        run: go run ./scripts/integration-report "$INTEGRATION_ARTIFACTS/test-results.jsonl"
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-diagnostics
          path: tests/integration/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  required:
    # Only PR validation can satisfy the merge rule. A faster branch-push run
    # must not publish the same required check name against the PR's head SHA.
    # Metadata edits must prove earlier full validation before reporting success.
    name: ${{ github.event_name == 'pull_request' && 'CI required' || 'CI branch or release' }}
    if: always()
    needs: [plan, metadata, verify, container, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report required check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INTEGRATION_REQUIRED: ${{ github.event_name == 'pull_request' || inputs.run-integration == true }}
        run: bash scripts/check-ci-results.sh
