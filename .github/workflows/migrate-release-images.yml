name: Migrate legacy images to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: migrate-legacy-images-to-ghcr
  cancel-in-progress: false

jobs:
  retag:
    if: github.repository == 'Entropic-Works/kafka-connect-healer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.0.0
            digest: sha256:acfcb4fa38e0bc63483ca22cb782bbd1a1b8ef8c9a64fd0c487b3481787da4c0
          - version: 0.0.1
            digest: sha256:5b5922b7b194e850b80b4e802f6bf178b584283390b8f608cc51958a2d10f264
          - version: 0.0.2
            digest: sha256:8dee386c9327b93155c6d0240bfbc2015180fffe48557ccb23a901c7be207f60
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install registry copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy the existing image index without rebuilding
        env:
          VERSION: ${{ matrix.version }}
          SOURCE_DIGEST: ${{ matrix.digest }}
        shell: bash
        run: |
          set -euo pipefail
          source=docker.io/entropicworks/kafka-connect-healer
          image=ghcr.io/entropic-works/kafka-connect-healer
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" {print $2}'
          }
          [[ "$(digest "$source:v$VERSION")" == "$SOURCE_DIGEST" ]]
          if existing=$(docker buildx imagetools inspect "$image:$VERSION" 2>inspect-error.txt); then
            [[ "$(awk '$1 == "Digest:" {print $2}' <<< "$existing")" == "$SOURCE_DIGEST" ]]
          else
            # A lookup failure other than an absent tag must not permit an overwrite.
            grep -Eq 'not found|manifest unknown' inspect-error.txt
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              "docker://$source@$SOURCE_DIGEST" "docker://$image:$VERSION"
          fi
          [[ "$(digest "$image:$VERSION")" == "$SOURCE_DIGEST" ]]
          printf '%s -> %s@%s\n' "$VERSION" "$image" "$SOURCE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
